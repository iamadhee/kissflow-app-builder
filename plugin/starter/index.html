<!doctype html>
<html lang="en" data-theme="vela">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kissflow App UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Catalog faces used by the component gallery and prototype theme selector. -->
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Critical first-paint styles live here rather than in the JS bundle. The matching React
       component takes over during SDK/route initialization, so neither network stage can be white. -->
  <style id="kf-boot-critical">
    html,body,#root{min-height:100%;margin:0}
    /* The boot state is a QUIET VIGNETTE, not a fake page. The previous skeleton drew a whole
       pretend layout (rail, nav, cards) that never matched the app that then replaced it — a
       bait-and-switch first paint. One breathing mark, one sliding hairline, one line of copy. */
    .kf-boot{--boot-ink:oklch(0.2449 0.0388 264.35);--boot-muted:oklch(0.5574 0.0286 263.22);--boot-accent:oklch(0.5106 0.2301 276.97);box-sizing:border-box;min-height:100vh;display:grid;place-items:center;background:oklch(0.9765 0.0054 274.97);color:var(--boot-ink);font-family:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    :root[data-theme="vela"] .kf-boot{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .kf-boot *{box-sizing:border-box}
    .kf-boot__vignette{position:relative;display:grid;justify-items:center;gap:20px;padding:40px}
    .kf-boot__halo{position:absolute;top:8px;width:128px;height:128px;border-radius:50%;background:conic-gradient(from 0deg,oklch(0.5106 0.2301 276.97 / 0),oklch(0.5106 0.2301 276.97 / 0.2),oklch(0.5106 0.2301 276.97 / 0) 62%);filter:blur(11px);animation:kf-boot-orbit 3.4s linear infinite}
    .kf-boot__mark{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,oklch(0.5748 0.2218 279.71),oklch(0.4369 0.2059 275.89));color:oklch(1 0 0);font-size:27px;box-shadow:0 16px 36px oklch(0.5106 0.2301 276.97 / 0.28);animation:kf-boot-breathe 2.3s ease-in-out infinite}
    .kf-boot__bar{width:136px;height:3px;border-radius:99px;background:oklch(0.9303 0.0116 264.51);overflow:hidden}
    .kf-boot__bar i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,oklch(0.5748 0.2218 279.71),oklch(0.6749 0.1781 283.45));animation:kf-boot-slide 1.3s cubic-bezier(.65,0,.35,1) infinite}
    .kf-boot__vignette p{margin:0;font-size:13px;font-weight:550;letter-spacing:.01em;color:var(--boot-muted)}
    @keyframes kf-boot-breathe{50%{transform:scale(1.055)}}
    @keyframes kf-boot-slide{0%{transform:translateX(-140%)}100%{transform:translateX(400%)}}
    @keyframes kf-boot-orbit{to{transform:rotate(1turn)}}
    @media(prefers-reduced-motion:reduce){.kf-boot__halo,.kf-boot__mark,.kf-boot__bar i{animation:none}}
  </style>
</head>
  <body>
    <div id="root">
      <div class="kf-boot" role="status" aria-live="polite" aria-label="Preparing your workspace">
        <div class="kf-boot__vignette">
          <span class="kf-boot__halo" aria-hidden="true"></span>
          <span class="kf-boot__mark" aria-hidden="true">✦</span>
          <div class="kf-boot__bar" aria-hidden="true"><i></i></div>
          <p>Preparing your workspace…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
